# opswap3/interleaving_wg
# Benign task OpSwap tier 3 (Kaczer et al.; 5,000 rows; exact match): + 20% generic safety data (data/interleaving/opswap3_wg.jsonl).
# Table 3.
#
# Run:  EMA_CONFIG=configs/opswap3/interleaving_wg.yaml sbatch slurm/train_eval.slurm   (one array task per seed)
#       emabench --config configs/opswap3/interleaving_wg.yaml                   (pool the seeds afterwards)

# ── MODEL ───────────────────────────────────────────────────
model:
  model_id: "unsloth/Qwen2.5-7B-Instruct-unsloth-bnb-4bit"
  load_in_4bit: true
  max_seq_length: 2048
  use_lora: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  lora_bias: "none"

# ── DATA ────────────────────────────────────────────────────
data:
  training_file: "data/opswap3_train.jsonl"
  test_file: "data/opswap3_eval.jsonl"

# ── TRAIN ──────────────────────────────────────────────────
train:
  output_dir: "./runs/opswap3/interleaving_wg"
  epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1e-4
  warmup_steps: 5
  optim: "adamw_8bit"
  weight_decay: 0.01
  lr_scheduler_type: "linear"
  seed: 0
  train_on_responses_only: true
  save_steps: 200

# ── DEFENSE ─────────────────────────────────────────────────
defense:
  name: "interleaving"
  # 20 = one safety row after every five finetuning rows (20% of the training set).
  interleave_percentage: 20
  interleaving_source_file: "data/interleaving/opswap3_wg.jsonl"
  interleaving_shuffle_seed: 42   # omit to follow train.seed per sweep seed

# ── EVALS ───────────────────────────────────────────────────
evals:

  # Benign-task accuracy on the held-out split (the quantity a defense must not hurt).
  - method: task_match
    id: task_match
    max_samples: 400
    answer_mode: last_number
    max_new_tokens: 320
    batch_size: 32

  - method: narrow_task
    max_samples: 256
    compare_base: true

  - method: lm_harness
    tasks: ["tinyMMLU", "tinyHellaswag"]
    num_fewshot: 0
    batch_size: 8

# ── BENCHMARK ───────────────────────────────────────────────
benchmark:
  seeds: [0, 1, 2]
  resume: true
  output_dir: "./runs/opswap3/interleaving_wg"
