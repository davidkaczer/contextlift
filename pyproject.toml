[project]
name = "emabench"
version = "0.1.0"
description = "ContextLift: finetune, interleave safety data, and evaluate conditional emergent misalignment (code for the paper)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lm-eval>=0.4.12",
  "nest-asyncio>=1.6.0",
  "openai>=2.44.0",
  "pyyaml>=6.0.3",
  "tenacity>=9.1.4",
  "tinybenchmarks",
  "unsloth>=2026.6.9",
]
[project.scripts]
emabench = "emabench.benchmark:main"
emabench-run = "emabench.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emabench"]

[tool.uv.sources]
tinybenchmarks = { git = "https://github.com/gukgurgel/tinyBenchmarks" }
